[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "podcast-archiver"
version = "2.3.0"
requires-python = ">=3.10,<4"
description = "Archive all episodes from your favorite podcasts"
authors = [
  {name = "Jan Willhaus", email = "mail@janwillhaus.de"},
]
maintainers = [
  {name = "Jan Willhaus", email = "mail@janwillhaus.de"},
]
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: System :: Archiving",
    "Topic :: Utilities",
]

dependencies = [
    "feedparser (>=6.0,<7)",
    "requests (>=2.29,<3)",
    "pydantic (>=2.5,<3)",
    "pyyaml (>=6.0,<7)",
    "rich-click (>=1.8,<2)",
    "python-slugify (>=8.0,<9)",
]


[project.urls]
Repository = "https://github.com/janw/podcast-archiver.git"
Issues = "https://github.com/janw/podcast-archiver/issues"
Changelog = "https://github.com/janw/podcast-archiver/blob/main/CHANGELOG.md"

[project.scripts]
podcast-archiver = 'podcast_archiver.cli:main'

[tool.poetry]
packages = [{ include = "podcast_archiver" }]

[tool.poetry.group.dev.dependencies]
ipython = "^8"
ipdb = "*"
ruff = "0.8.6"
pre-commit = ">=3,<5"
commitizen = ">=3,<5"
rich-codex = "^1"
mypy = "^1"

[tool.poetry.group.tests.dependencies]
pytest = "^8"
pytest-cov = ">=5,<7"
pytest-recording = "^0.13.2"
pytest-env = "1.1.5"
coverage-conditional-plugin = "^0.9.0"
responses = "^0.25.3"

[tool.commitizen]
version_scheme = "semver"
version_provider = "poetry"
version_files = [
    "pyproject.toml:version = ",
    "podcast_archiver/__init__.py",
]
annotated_tag = true
tag_format = "v$version"
update_changelog_on_bump = true
changelog_start_rev = "0.4"
gpg_sign = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
extend-select = [
    "I",   # isort
    "B",   # bugbear
    "A",   # builtins
    "ISC", # implicit-str-concat
    "Q",   # quotes
    "TID", # tidy-imports
    "C4",  # comprehensions
    "SIM", # simplify
    "C90", # mccabe
    "FA",  # future-annotations
    "TCH", # type-checking
    "RUF", # ruff-specific
]
ignore = [
    "SIM108", # if-else-block-instead-of-if-exp
    "ISC001", # single-line-implicit-string-concatenation
]

[tool.ruff.lint.per-file-ignores]
"compat.py" = ["F401"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests",]
addopts = "--block-network --cov podcast_archiver --cov-config=pyproject.toml --cov-report term --no-cov-on-fail"

[tool.pytest_env]
PODCAST_ARCHIVER_CONFIG = ""
TESTING = 1

[tool.coverage.run]
branch = true
source = ["podcast_archiver"]
plugins = ["coverage_conditional_plugin"]

[tool.coverage.coverage_conditional_plugin.rules]
no-cover-gte-311 = "sys_version_info >= (3, 11)"
no-cover-lt-311 = "sys_version_info < (3, 11)"

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
]
fail_under = 60
precision = 2
show_missing = true

[tool.mypy]
disallow_untyped_defs = true
disallow_any_generics = true
# disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# warn_return_any = true
strict_optional = true
strict_equality = true
check_untyped_defs = true
no_implicit_reexport = true

packages = ["podcast_archiver", "tests"]
plugins = [
    "pydantic.mypy",
]

[[tool.mypy.overrides]]
module = [
    "feedparser.*",
    "requests.*",
    "slugify.*",
    "yaml.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["podcast_archiver.compat.*"]
implicit_reexport = true
